# CodeRabbit reviews every pull request. https://docs.coderabbit.ai
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches: ["main"]
  path_instructions:
    - path: "packages/core/**"
      instructions: >-
        Money must stay in integer minor units with an ISO 4217 code. Check that every split
        adds up to its total and that balances add up to zero per currency. Flag any float
        arithmetic on stored amounts.
    - path: "apps/sync/**"
      instructions: >-
        The server must never see plain user data. Flag any code that logs, stores or forwards
        decrypted content, or that weakens the access-token check.
    - path: "apps/web/src/lib/**"
      instructions: >-
        Writes go to the device first. Flag anything that blocks the UI on the network or that
        sends the group key to a server.
chat:
  auto_reply: true
