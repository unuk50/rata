name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Do not paste real names, amounts or invite links.
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: input
    id: device
    attributes:
      label: Device and browser
