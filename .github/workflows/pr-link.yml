name: PR link

# pull_request_target runs this file and the checker from the base branch, so a
# pull request cannot change the rule that checks it. It never checks out or
# runs code from the pull request.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  why:
    name: Links an issue or a product direction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Check the pull request body
        env:
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          case "$AUTHOR" in renovate\[bot\]|dependabot\[bot\]) echo "Dependency update: no link needed."; exit 0;; esac
          body=$(printf '%s' "$BODY" | perl -0pe 's/<!--.*?-->//gs')
          if printf '%s' "$body" | grep -Eiq '(^|[^[:alnum:]])(close[sd]?|fix(e[sd])?|resolve[sd]?|refs?)[[:space:]]+(#[0-9]+|https://github\.com/[^[:space:]]+/issues/[0-9]+)'; then
            echo "Links an issue."; exit 0
          fi
          if printf '%s' "$body" | python3 .github/scripts/check_direction.py; then
            echo "Links a product direction."; exit 0
          fi
          echo "::error::Add 'Closes #N', 'Refs #N' or 'Direction: docs/product/<file>#<section>' (an existing file and heading) to the pull request body. See CONTRIBUTING.md."
          exit 1
